<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="shortcut icon" href="./icon.png" type="image/x-icon">
    <title>Nixie Clock</title>
</head>
<body>
    <div class="clock-container">
        <div class="digit unit" id="digit1">
            <video class="v-a" muted playsinline></video>
            <video class="v-b" muted playsinline style="visibility:hidden;"></video>
        </div>
        <div class="digit unit" id="digit2">
            <video class="v-a" muted playsinline></video>
            <video class="v-b" muted playsinline style="visibility:hidden;"></video>
        </div>

        <div class="colon unit">
            <video src="./time/colon_2k.webm" muted autoplay playsinline loop></video>
        </div>

        <div class="digit unit" id="digit3">
            <video class="v-a" muted playsinline></video>
            <video class="v-b" muted playsinline style="visibility:hidden;"></video>
        </div>
        <div class="digit unit" id="digit4">
            <video class="v-a" muted playsinline></video>
            <video class="v-b" muted playsinline style="visibility:hidden;"></video>
        </div>

        <div class="colon unit">
            <video src="./time/colon_2k.webm" muted autoplay playsinline loop></video>
        </div>

        <div class="digit unit" id="digit5">
            <video class="v-a" muted playsinline></video>
            <video class="v-b" muted playsinline style="visibility:hidden;"></video>
        </div>
        <div class="digit unit" id="digit6">
            <video class="v-a" muted playsinline></video>
            <video class="v-b" muted playsinline style="visibility:hidden;"></video>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
